<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1f23; color: #e8e8ea; font: 14px/1.5 system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  #top { position: fixed; top: 12px; left: 12px; right: 12px; }
  #ui { display: flex; flex-wrap: wrap; gap: 6px; }
  button { background: #2e3138; color: inherit; border: 1px solid #454a54; border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: #3d5bd9; border-color: #3d5bd9; }
  #stats, #help { position: fixed; bottom: 12px; opacity: .65; font-size: 12px; }
  #stats { left: 12px; font-variant-numeric: tabular-nums; }
  #help { right: 12px; text-align: right; }
  #status, #log { font-size: 13px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px #000; }
  #status { margin-top: 8px; opacity: .85; }
  #log { margin-top: 4px; }
  .step { display: flex; gap: 8px; animation: step-in .25s ease-out; }
  .step .mark { width: 1em; text-align: center; }
  .step .name { min-width: 11.5em; }
  .step.current { color: #9db2ff; }
  .step.done { opacity: .6; }
  .step.done .mark { color: #5fd38d; }
  @keyframes step-in { from { opacity: 0; transform: translateX(-6px); } }
  @media (prefers-reduced-motion: reduce) { .step { animation: none; } }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div id="top">
  <div id="ui"></div>
  <div id="status"></div>
  <div id="log"></div>
</div>
<div id="stats"></div>
<div id="help">ドラッグ: 視点回転 / ホイール・ピンチ: ズーム<br>U D L R F B キー: 外側の面を回す（Shift で逆回転）</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { getModel, stickerIndex } from '../solver/cube.js';

const SIZES = [3, 4, 5, 6, 10, 15, 20];
const COLOR_IDS = { white: 0, red: 1, green: 2, yellow: 3, orange: 4, blue: 5 };
const METHOD_NAMES = { computer: 'コンピューター式', human: '人の手順' };
const STAGE_NAMES = {
  '3x3': '3x3 部分', corners: 'コーナー', edges: 'エッジ', centers: 'センター',
  firstCenter: 'センター（1 面目）', oppositeCenter: 'センター（反対の面）', thirdCenter: 'センター（3 面目）',
  fourthCenter: 'センター（4 面目）', lastCenters: 'センター（残り 2 面）',
  pairing: 'エッジのペアリング', edgeParity: 'エッジのパリティ',
  cross: '下面のクロス', firstLayer: '1 段目のコーナー', secondLayer: '2 段目のエッジ', ollParity: 'OLL パリティ',
  topCross: '上面のクロス', topFace: '上面の色をそろえる', topCorners: '上段コーナーの位置', pllParity: 'PLL パリティ',
  topEdges: '上段エッジの位置',
};
const AXES = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };
// Clockwise as seen from outside the face: axis, outer layer (0 or n-1), quarter-turn sign.
const FACE_MOVES = { U: ['y', 1, -1], D: ['y', 0, 1], R: ['x', 1, -1], L: ['x', 0, 1], F: ['z', 1, -1], B: ['z', 0, 1] };

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// World matrices are only recomputed when a layer moves; see syncInstances().
scene.matrixWorldAutoUpdate = false;
scene.background = new THREE.Color(0x1d1f23);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 1.0);
key.position.set(3, 5, 4);
scene.add(key);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.02, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const loader = new GLTFLoader();
const maxAniso = renderer.capabilities.getMaxAnisotropy();
const stats = document.getElementById('stats');
const status = document.getElementById('status');
const log = document.getElementById('log');
let model = null, cube = null, cubies = [], size = 0, lastMove = null;
let instances = [], moved = true;
let queue = Promise.resolve();
let worker = null, solving = false, playClock = 0;
const solveButtons = [];

const enqueue = (fn) => (queue = queue.then(fn).catch((e) => {
  status.textContent = `エラー: ${e.message}`;
  setSolving(false);
}));

async function load(n) {
  stats.textContent = '読み込み中…';
  const gltf = await loader.loadAsync(`../dist/cube_${n}x${n}.gltf`);
  if (model) scene.remove(model);
  model = gltf.scene;
  cube = model.getObjectByName(`Cube${n}x${n}`);
  cubies = cube.children.filter((o) => o.userData.grid);
  model.traverse((o) => {
    if (!o.material) return;
    for (const k of ['map', 'normalMap', 'roughnessMap', 'metalnessMap']) {
      if (o.material[k]) o.material[k].anisotropy = maxAniso;
    }
  });
  scene.add(model);
  buildInstances();
  size = n;
  lastMove = null;
  camera.position.set(1, 0.85, 1.3).normalize().multiplyScalar(n * 4.2);
  controls.target.set(0, 0, 0);
  controls.minDistance = n * 0.5 + 0.35;
  controls.maxDistance = n * 10;
  for (const b of document.querySelectorAll('[data-size]')) b.setAttribute('aria-pressed', String(+b.dataset.size === n));
  status.textContent = '';
  log.textContent = '';
}

// Meshes that share a geometry and a material are drawn as one InstancedMesh, which keeps even
// the biggest cube to a few dozen draw calls. The glTF meshes stay in the scene graph, hidden, so
// turning layers and reading the state still work on them; their world matrices are copied into
// the instances whenever something moved.
function buildInstances() {
  for (const { mesh } of instances) {
    scene.remove(mesh);
    mesh.dispose();
  }
  const groups = new Map();
  cube.traverse((o) => {
    if (!o.isMesh) return;
    const key = `${o.geometry.uuid}/${o.material.uuid}`;
    if (!groups.has(key)) groups.set(key, { geometry: o.geometry, material: o.material, sources: [] });
    groups.get(key).sources.push(o);
  });
  instances = [...groups.values()].map(({ geometry, material, sources }) => {
    const mesh = new THREE.InstancedMesh(geometry, material, sources.length);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    mesh.frustumCulled = false;
    scene.add(mesh);
    return { mesh, sources };
  });
  for (const c of cubies) c.visible = false;
  moved = true;
}

function syncInstances() {
  scene.updateMatrixWorld();
  for (const { mesh, sources } of instances) {
    for (let i = 0; i < sources.length; i++) mesh.setMatrixAt(i, sources[i].matrixWorld);
    mesh.instanceMatrix.needsUpdate = true;
  }
}

function snap(o) {
  const off = (size - 1) / 2;
  o.position.set(...o.position.toArray().map((v) => Math.round(v + off) - off));
  const m = new THREE.Matrix4().makeRotationFromQuaternion(o.quaternion);
  m.elements = m.elements.map(Math.round);
  o.quaternion.setFromRotationMatrix(m);
}

function turn(axis, layer, quarter, ms = 220) {
  return enqueue(() => new Promise((resolve) => {
    const coord = layer - (size - 1) / 2;
    const pivot = new THREE.Object3D();
    cube.add(pivot);
    const members = cubies.filter((c) => Math.abs(c.position[axis] - coord) < 0.25);
    for (const c of members) pivot.attach(c);
    const start = performance.now();
    const step = (now) => {
      moved = true;
      const t = ms > 0 ? Math.min(1, (now - start) / ms) : 1;
      const e = t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
      pivot.setRotationFromAxisAngle(AXES[axis], quarter * e * Math.PI / 2);
      if (t < 1) return requestAnimationFrame(step);
      for (const c of members) { cube.attach(c); snap(c); }
      cube.remove(pivot);
      resolve();
    };
    if (ms > 0) requestAnimationFrame(step);
    else step(start);
  }));
}

function faceTurn(face, inverse, ms) {
  const [axis, outer, quarter] = FACE_MOVES[face];
  return turn(axis, outer ? size - 1 : 0, inverse ? -quarter : quarter, ms);
}

function shuffle() {
  const total = size * 8;
  enqueue(() => (log.textContent = ''));
  for (let i = 0; i < total; i++) {
    let move;
    do {
      move = { axis: 'xyz'[Math.floor(Math.random() * 3)], layer: Math.floor(Math.random() * size) };
    } while (lastMove && move.axis === lastMove.axis && move.layer === lastMove.layer);
    lastMove = move;
    enqueue(() => (status.textContent = `あと ${total - i} 手シャッフルします（${i + 1} / ${total}）`));
    turn(move.axis, move.layer, Math.random() < 0.5 ? 1 : -1, 140);
  }
  enqueue(() => (status.textContent = `シャッフル完了（${total} 手）`));
}

// Sticker colors in the solver's facelet order, read from where each sticker currently is.
function readState() {
  const facelets = getModel(size);
  const state = new Uint8Array(facelets.size).fill(255);
  const at = new THREE.Vector3();
  cube.updateMatrixWorld(true);
  for (const cubie of cubies) {
    const p = cubie.position.toArray().map((v) => Math.round(v * 2));
    for (const sticker of cubie.children) {
      if (!sticker.userData.color) continue;
      cube.worldToLocal(sticker.getWorldPosition(at));
      const normal = at.sub(cubie.position).toArray().map((v) => Math.round(v * 2));
      state[stickerIndex(facelets, p, normal)] = COLOR_IDS[sticker.userData.color];
    }
  }
  if (state.includes(255)) throw new Error('盤面を読み取れませんでした');
  return state;
}

// One line per stage, kept after the stage is done so the whole solve reads as a log.
function addStep(name) {
  const row = document.createElement('div');
  row.className = 'step current';
  for (const [cls, text] of [['mark', '▶'], ['name', name], ['count', '']]) {
    const span = document.createElement('span');
    span.className = cls;
    span.textContent = text;
    row.append(span);
  }
  log.append(row);
  return row;
}

function setSolving(on) {
  solving = on;
  for (const b of solveButtons) b.disabled = on;
  if (!on) clearInterval(playClock);
}

const num = (v) => Math.round(v).toLocaleString('ja-JP');
const msText = (ms) => `${num(ms)} ms`;

function requestSolution(n, state, method) {
  worker ??= new Worker(new URL('../solver/worker.js', import.meta.url), { type: 'module' });
  return new Promise((resolve, reject) => {
    worker.onmessage = ({ data }) => (data.error ? reject(new Error(data.error)) : resolve(data));
    worker.onerror = (e) => reject(new Error(e.message));
    worker.postMessage({ n, state, method });
  });
}

function solve(method) {
  if (solving) return;
  setSolving(true);
  const label = METHOD_NAMES[method];
  status.textContent = `${label}: 解法を計算中…`;
  log.textContent = '';
  return enqueue(async () => {
    const result = await requestSolution(size, readState(), method);
    const count = result.moves.length;
    const calc = `計算 ${msText(result.ms)}`;
    status.textContent = count ? `${label}: ${num(count)} 手 · ${calc}` : 'もう揃っています';
    const ms = Math.max(30, Math.min(220, 30000 / count));
    let played = 0;
    let start = 0;
    const showProgress = () => (status.textContent = `${label}: ${num(played)} / ${num(count)} 手 · ${calc} · 再生 ${msText(performance.now() - start)}`);
    if (count) {
      enqueue(() => {
        start = performance.now();
        playClock = setInterval(showProgress, 100);
      });
    }
    let done = 0;
    for (const stage of result.stages) {
      if (!stage.moves) continue;
      // A short pause between stages makes each one easier to follow.
      if (done) enqueue(() => new Promise((resolve) => setTimeout(resolve, 300)));
      let row;
      enqueue(() => (row = addStep(STAGE_NAMES[stage.name])));
      for (let k = 1; k <= stage.moves; k++) {
        const m = result.moves[done++];
        const at = done;
        enqueue(() => {
          row.lastChild.textContent = `${num(k)} / ${num(stage.moves)} 手`;
          played = at;
          showProgress();
        });
        turn('xyz'[m.axis], m.layer, m.q, ms);
      }
      enqueue(() => {
        row.className = 'step done';
        row.firstChild.textContent = '✓';
        row.lastChild.textContent = `${num(stage.moves)} 手`;
      });
    }
    enqueue(() => {
      const elapsed = performance.now() - start;
      setSolving(false);
      if (count) status.textContent = `${label}: 完成（${num(count)} 手 · ${calc} · 再生 ${msText(elapsed)}）`;
    });
  });
}

const ui = document.getElementById('ui');
for (const n of SIZES) {
  const b = document.createElement('button');
  b.textContent = `${n}×${n}`;
  b.dataset.size = n;
  b.onclick = () => enqueue(() => load(n));
  ui.append(b);
}
const buttons = [
  ['シャッフル', shuffle],
  ['コンピューター式で解く', () => solve('computer'), true],
  ['人の手順で解く', () => solve('human'), true],
  ['リセット', () => enqueue(() => load(size))],
];
for (const [label, fn, isSolve] of buttons) {
  const b = document.createElement('button');
  b.textContent = label;
  b.onclick = fn;
  ui.append(b);
  if (isSolve) solveButtons.push(b);
}

addEventListener('keydown', (e) => {
  const face = e.key.toUpperCase();
  if (FACE_MOVES[face] && !e.metaKey && !e.ctrlKey) faceTurn(face, e.shiftKey);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  // Fit the depth range to the cube's bounding sphere (turning layers stay inside it). With a
  // fixed near plane, depth precision at a big cube's viewing distance gets coarser than the
  // sticker's thickness and the body shows through the stickers.
  const distance = camera.position.distanceTo(controls.target);
  const radius = size * 0.87 + 0.1;
  camera.near = Math.max(0.02, distance - radius);
  camera.far = distance + radius;
  camera.updateProjectionMatrix();
  if (moved) {
    syncInstances();
    moved = false;
  }
  renderer.render(scene, camera);
  if (cube) stats.textContent = `${size}×${size} · ${cubies.length} パーツ · ${renderer.info.render.calls} draw calls · ${renderer.info.render.triangles.toLocaleString()} 三角形`;
});

window.viewer = { turn, faceTurn, shuffle, solve, readState, load: (n) => enqueue(() => load(n)), get cubies() { return cubies; }, camera, controls };
enqueue(() => load(3));
</script>
</body>
</html>
